name: Publier le site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rendu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Installer knitr et rmarkdown
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown"))'

      # Installée hors du projet : dans le projet, `quarto add` lirait la leçon,
      # qui inclut un fichier de l'extension pas encore présent.
      - name: Installer l'extension quarto-live (webR)
        run: |
          tmp="$(mktemp -d)"
          (cd "$tmp" && quarto add r-wasm/quarto-live --no-prompt)
          cp -r "$tmp/_extensions" "$GITHUB_WORKSPACE/"

      - name: Rendre le site
        run: quarto render

      - name: Résumer le poids des pages
        run: |
          {
            echo "## Poids du site publié (webR non compris)"
            echo
            echo "| Fichier | Taille |"
            echo "| --- | --- |"
            find _site -name '*.html' -exec du -k {} + | sort -n | awk '{print "| " $2 " | " $1 " Ko |"}'
            echo
            echo "Total du dossier _site : $(du -sk _site | cut -f1) Ko"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploiement:
    if: github.event_name != 'pull_request'
    needs: rendu
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
